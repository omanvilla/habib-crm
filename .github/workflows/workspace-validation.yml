name: Workspace list and marketing checks
on:
  push:
    branches: ['codex/workspace-polish-20261020']
permissions:
  contents: read
jobs:
  workspace-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve deals and backend byte-for-byte
        run: git diff --exit-code 43bdfe20dabc843744ce308b18bcbe68d4dd42c2 -- app-base-v15.html crm-deal-workflow.js crm-deal-workflow.css db/ supabase/
      - run: node --test tests/*.test.cjs
      - run: node tests/security-regressions.cjs
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/workspace-browser.cjs
      - run: node tests/dashboard-compact-browser.cjs
      - run: node tests/deal-date-coherence-browser.cjs
      - run: node tests/inquiry-followup-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-v13-verification
          path: preview-results/
