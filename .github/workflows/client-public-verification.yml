name: Verify published client chronology v17
on:
  push:
    branches: ['codex/client-public-verification-20261021']
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tests/client-public-verification.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/client-public-startup.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-v17-public-verification
          path: public-verification/
