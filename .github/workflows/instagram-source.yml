name: Instagram implementation source
on:
  push:
    branches: ['codex/instagram-discovery-20261021']
    paths: ['.github/workflows/instagram-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: git bundle create /tmp/habib-current.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: instagram-current-source
          path: /tmp/habib-current.bundle
          retention-days: 1
