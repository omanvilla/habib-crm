name: Verify published marketing v15
on:
  push:
    branches: ['codex/marketing-public-verification-20261021']
permissions:
  contents: read
jobs:
  public-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify all actual public runtime hashes
        run: python3 tests/marketing-public-verification.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Inspect empty public browser startup without sign-in or API requests
        run: node tests/marketing-public-startup.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketing-v15-public-verification
          path: public-verification/
