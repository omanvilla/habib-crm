name: CI
# Runs the repository's unit and security tests for every pull request into
# main and every push to main. The older workflows only run on their own
# codex/* branches, so changes merged through pull requests had no checks.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # security-regressions.cjs compares against earlier commits with git show.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - run: node tests/security-regressions.cjs
  owner-route-sql:
    # SQL68 on a synthetic copy of the live owner-only isolation catalog.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: synthetic-test-only
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPORT: 5432
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/owner-private-route-sql.sh
