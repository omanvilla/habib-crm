name: CI
# Runs the repository's unit and security tests for every pull request into
# main and every push to main. The older workflows only run on their own
# codex/* branches, so changes merged through pull requests had no checks.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # security-regressions.cjs compares against earlier commits with git show.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: |
          set -o pipefail
          node --test --test-reporter=spec tests/*.test.cjs 2>&1 | tee test-output.txt
      # The run log needs a GitHub login; the names of failing tests also go into a public annotation.
      - name: List failing tests
        if: failure()
        run: echo "::error title=Failing tests::$(grep '✖' test-output.txt | sed 's/^ *//' | sort -u | head -60 | tr '\n' '|')"
      - name: Security regressions
        id: security
        if: success() || failure()
        run: |
          set -o pipefail
          node tests/security-regressions.cjs 2>&1 | tee security-output.txt
      - name: Show the security regression that failed
        if: failure() && steps.security.outcome == 'failure'
        run: echo "::error title=Security regression::after $(grep '^PASS' security-output.txt | tail -1 | cut -c1-200) | $(grep -v '^PASS' security-output.txt | head -8 | tr '\n' '|' | cut -c1-1500)"
  owner-route-sql:
    # SQL68 on a synthetic copy of the live owner-only isolation catalog.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: synthetic-test-only
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPORT: 5432
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/owner-private-route-sql.sh
