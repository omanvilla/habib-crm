name: CRM isolated preview checks
on:
  push:
    branches: ['codex/role-workflows-ui-preview-20260930']
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run existing test suite
        run: node --test tests/*.test.cjs
      - name: Run security regression script
        run: node tests/security-regressions.cjs
