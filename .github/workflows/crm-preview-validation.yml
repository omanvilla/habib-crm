name: CRM isolated preview checks
on:
  push:
    branches: ['codex/role-workflows-ui-preview-20260930', 'codex/reservation-period-20261018', 'codex/comprehensive-audit-20261018']
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - run: node tests/security-regressions.cjs
  synthetic-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/preview-browser.cjs
      - run: node tests/investment-browser.cjs
      - run: node tests/dashboard-browser.cjs
      - run: node tests/reservation-browser.cjs
      - run: node tests/audit-browser.cjs
      - run: node tests/audit-fault-browser.cjs
      - run: node tests/inventory-target-browser.cjs
      - run: node tests/performance-coherence-browser.cjs
      - run: node tests/deal-date-coherence-browser.cjs
      - run: node tests/inquiry-followup-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-crm-before-after
          path: preview-results/

  attribution-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: synthetic-test-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test branch attribution on isolated PostgreSQL
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f tests/fixtures/employee-attribution.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f db/changes/11-approved-branch-employee-attribution.forward.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f tests/fixtures/employee-attribution-assert.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f tests/fixtures/employee-performance.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f db/changes/12-approved-performance-credit.forward.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f tests/fixtures/employee-performance-assert.sql

  workflows-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: synthetic-test-only
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPORT: 5432
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test atomic visit request resolution and concurrent saves
        run: |
          createdb crm_visit_test
          psql -d crm_visit_test -v ON_ERROR_STOP=1 -f tests/fixtures/visit-auto-request.sql
          psql -d crm_visit_test -v ON_ERROR_STOP=1 -f db/changes/13-visit-auto-request.forward.sql
          psql -d crm_visit_test -v ON_ERROR_STOP=1 -f tests/fixtures/visit-auto-request-assert.sql
          HABIB_VISIT_TEST_DATABASE=crm_visit_test node tests/visit-auto-request.test.cjs
      - name: Test atomic historical and current deal workflows
        run: |
          createdb crm_deal_test
          psql -d crm_deal_test -v ON_ERROR_STOP=1 -f tests/fixtures/rejection-consistency.sql
          psql -d crm_deal_test -v ON_ERROR_STOP=1 -f db/changes/13-visit-auto-request.forward.sql
          psql -d crm_deal_test -v ON_ERROR_STOP=1 -f db/changes/14-deal-workflow.forward.sql
          psql -d crm_deal_test -v ON_ERROR_STOP=1 -f db/changes/15-primary-rejection-consistency.forward.sql
          psql -d crm_deal_test -v ON_ERROR_STOP=1 -f tests/fixtures/deal-workflow-assert.sql
      - name: Test primary rejection history and report consistency
        run: |
          createdb crm_rejection_test
          psql -d crm_rejection_test -v ON_ERROR_STOP=1 -f tests/fixtures/rejection-consistency.sql
          psql -d crm_rejection_test -v ON_ERROR_STOP=1 -f db/changes/13-visit-auto-request.forward.sql
          psql -d crm_rejection_test -v ON_ERROR_STOP=1 -f db/changes/14-deal-workflow.forward.sql
          psql -d crm_rejection_test -v ON_ERROR_STOP=1 -f db/changes/15-primary-rejection-consistency.forward.sql
          psql -d crm_rejection_test -v ON_ERROR_STOP=1 -f tests/fixtures/rejection-consistency-assert.sql
      - name: Test WhatsApp receiving-branch fallback without real contacts
        run: |
          createdb crm_whatsapp_branch_test
          psql -d crm_whatsapp_branch_test -v ON_ERROR_STOP=1 -f tests/fixtures/whatsapp-branch-fallback.sql
          psql -d crm_whatsapp_branch_test -v ON_ERROR_STOP=1 -f db/changes/17-whatsapp-branch-fallback.forward.sql
          psql -d crm_whatsapp_branch_test -v ON_ERROR_STOP=1 -f tests/fixtures/whatsapp-branch-fallback-assert.sql

  investment-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: synthetic-test-only
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPORT: 5432
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify owner-only investment against the existing catalog and synthetic records
        run: |
          createdb crm_investment_test
          psql -d crm_investment_test -v ON_ERROR_STOP=1 -f tests/fixtures/investment-owner-only.sql
          psql -d crm_investment_test -v ON_ERROR_STOP=1 -f db/changes/18-investment-owner-only.forward.sql
          psql -d crm_investment_test -v ON_ERROR_STOP=1 -f tests/fixtures/investment-owner-only-assert.sql
          psql -d crm_investment_test -v ON_ERROR_STOP=1 -f tests/fixtures/investment-rpc-assert.sql
          psql -d crm_investment_test -v ON_ERROR_STOP=1 -f tests/fixtures/investment-attribution-assert.sql
          psql -d crm_investment_test -v ON_ERROR_STOP=1 -f tests/fixtures/dashboard-workspace-before.sql
          psql -d crm_investment_test -v ON_ERROR_STOP=1 -f db/changes/19-dashboard-workspace.forward.sql
          psql -d crm_investment_test -v ON_ERROR_STOP=1 -f tests/fixtures/dashboard-workspace-assert.sql
          psql -d crm_investment_test -v ON_ERROR_STOP=1 -f tests/fixtures/dashboard-performance-before.sql
          psql -d crm_investment_test -v ON_ERROR_STOP=1 -f db/changes/20-dashboard-performance.forward.sql
          psql -d crm_investment_test -v ON_ERROR_STOP=1 -f tests/fixtures/dashboard-performance-assert.sql
          psql -d crm_investment_test -v ON_ERROR_STOP=1 -f db/changes/21-saved-link-inquiry-reconciliation.forward.sql
          psql -d crm_investment_test -v ON_ERROR_STOP=1 -f tests/fixtures/dashboard-inquiries-assert.sql
          psql -d crm_investment_test -v ON_ERROR_STOP=1 -f tests/fixtures/semantic-inquiries-before.sql
          psql -d crm_investment_test -v ON_ERROR_STOP=1 -f db/changes/22-semantic-inquiries.forward.sql
          psql -d crm_investment_test -v ON_ERROR_STOP=1 -f db/changes/22-semantic-inquiries.forward.sql
          psql -d crm_investment_test -v ON_ERROR_STOP=1 -f tests/fixtures/semantic-inquiries-assert.sql
          psql -d crm_investment_test -v ON_ERROR_STOP=1 -f tests/fixtures/investment-rpc-assert.sql
          psql -d crm_investment_test -v ON_ERROR_STOP=1 -f tests/fixtures/investment-attribution-assert.sql
          psql -d crm_investment_test -v ON_ERROR_STOP=1 -f db/changes/22-semantic-inquiries.rollback.sql
          psql -d crm_investment_test -v ON_ERROR_STOP=1 -f tests/fixtures/semantic-inquiries-rollback-assert.sql
          psql -d crm_investment_test -v ON_ERROR_STOP=1 -f db/changes/20-dashboard-performance.rollback.sql
          psql -d crm_investment_test -v ON_ERROR_STOP=1 -f tests/fixtures/dashboard-performance-rollback-assert.sql

  reservations-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: synthetic-test-only
      PGHOST: 127.0.0.1
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify booking, completion, receipts and rollback on isolated PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/investment-owner-only.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/18-investment-owner-only.forward.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/19-dashboard-workspace.forward.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/20-dashboard-performance.forward.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/23-performance-client-metrics.forward.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261018070412_employee_booking_milestones_20261018.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261018071206_employee_target_snapshot_20261018.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261018071343_confirm_paid_reservation_rpc_20261018.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261018072621_employee_target_snapshot_security_definer_fix_20261018.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/24-reservation-period-performance.forward.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/24-reservation-period-performance.forward.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/reservation-period-assert.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/24-reservation-period-performance.rollback.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/reservation-period-rollback-assert.sql

  comprehensive-audit-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: synthetic-test-only
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPORT: 5432
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify reservation acceptance, goals, activity writes and non-destructive rollback
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/investment-owner-only.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/18-investment-owner-only.forward.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/19-dashboard-workspace.forward.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/20-dashboard-performance.forward.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/23-performance-client-metrics.forward.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261018070412_employee_booking_milestones_20261018.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261018071206_employee_target_snapshot_20261018.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261018071343_confirm_paid_reservation_rpc_20261018.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261018072621_employee_target_snapshot_security_definer_fix_20261018.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/24-reservation-period-performance.forward.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/reservation-period-assert.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/25-comprehensive-audit-repairs.forward.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/25-comprehensive-audit-repairs.forward.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/comprehensive-audit-assert.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/26-financial-reporting-preservation.forward.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/26-financial-reporting-preservation.forward.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/financial-reporting-preservation-assert.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/inventory-goal-before.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/27-inventory-goal-source.forward.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/27-inventory-goal-source.forward.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/inventory-goal-assert.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/performance-coherence-before.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/28-performance-coherence.forward.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/28-performance-coherence.forward.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/performance-coherence-assert.sql
          # SQL29 acceptance intentionally keeps its synthetic follow-up events
          # to prove rollback preserves them. Isolate that lifecycle so SQL28/27
          # can still verify their own unchanged predecessor business snapshots.
          pg_dump > /tmp/habib-followup-catalog.sql
          createdb crm_inquiry_followup_test
          psql -d crm_inquiry_followup_test -v ON_ERROR_STOP=1 -f /tmp/habib-followup-catalog.sql
          psql -d crm_inquiry_followup_test -v ON_ERROR_STOP=1 -f db/changes/29-inquiry-followup-coherence.forward.sql
          psql -d crm_inquiry_followup_test -v ON_ERROR_STOP=1 -f db/changes/29-inquiry-followup-coherence.forward.sql
          psql -d crm_inquiry_followup_test -v ON_ERROR_STOP=1 -f tests/fixtures/inquiry-followup-assert.sql
          HABIB_FOLLOWUP_TEST_DATABASE=crm_inquiry_followup_test node tests/inquiry-followup-concurrency.cjs
          psql -d crm_inquiry_followup_test -v ON_ERROR_STOP=1 -f tests/fixtures/inquiry-followup-rollback-guard.sql
          if psql -d crm_inquiry_followup_test -v ON_ERROR_STOP=1 -f db/changes/29-inquiry-followup-coherence.rollback.sql > /tmp/habib-inquiry-rollback-guard.log 2>&1; then
            cat /tmp/habib-inquiry-rollback-guard.log
            exit 1
          fi
          grep -F 'SQL29 rollback refused: function changed since release' /tmp/habib-inquiry-rollback-guard.log
          psql -d crm_inquiry_followup_test -v ON_ERROR_STOP=1 -f tests/fixtures/inquiry-followup-rollback-restore.sql
          psql -d crm_inquiry_followup_test -v ON_ERROR_STOP=1 -f db/changes/29-inquiry-followup-coherence.rollback.sql
          psql -d crm_inquiry_followup_test -v ON_ERROR_STOP=1 -f tests/fixtures/inquiry-followup-rollback-assert.sql
          dropdb crm_inquiry_followup_test
          # SQL30 reproduces authorized inboxes attached to another branch's
          # primary client. Keep those fixtures outside predecessor fingerprints.
          createdb crm_staff_volume_test
          psql -d crm_staff_volume_test -v ON_ERROR_STOP=1 -f /tmp/habib-followup-catalog.sql
          psql -d crm_staff_volume_test -v ON_ERROR_STOP=1 -f db/changes/29-inquiry-followup-coherence.forward.sql
          psql -d crm_staff_volume_test -v ON_ERROR_STOP=1 -f tests/fixtures/staff-message-volume-before.sql
          cmp db/changes/30-staff-message-volume-scope.forward.sql supabase/migrations/*_staff_message_volume_scope_20261019.sql
          psql -d crm_staff_volume_test -v ON_ERROR_STOP=1 -f db/changes/30-staff-message-volume-scope.forward.sql
          psql -d crm_staff_volume_test -v ON_ERROR_STOP=1 -f db/changes/30-staff-message-volume-scope.forward.sql
          psql -d crm_staff_volume_test -v ON_ERROR_STOP=1 -f tests/fixtures/staff-message-volume-assert.sql
          psql -d crm_staff_volume_test -v ON_ERROR_STOP=1 -f tests/fixtures/staff-message-volume-rollback-guard-before.sql
          if psql -d crm_staff_volume_test -v ON_ERROR_STOP=1 -f db/changes/30-staff-message-volume-scope.forward.sql > /tmp/habib-staff-volume-apply-guard.log 2>&1; then
            cat /tmp/habib-staff-volume-apply-guard.log
            exit 1
          fi
          grep -F 'SQL30 apply refused: function or permissions changed since release' /tmp/habib-staff-volume-apply-guard.log
          if psql -d crm_staff_volume_test -v ON_ERROR_STOP=1 -f db/changes/30-staff-message-volume-scope.rollback.sql > /tmp/habib-staff-volume-rollback-guard.log 2>&1; then
            cat /tmp/habib-staff-volume-rollback-guard.log
            exit 1
          fi
          grep -F 'SQL30 rollback refused: function or permissions changed since release' /tmp/habib-staff-volume-rollback-guard.log
          psql -d crm_staff_volume_test -v ON_ERROR_STOP=1 -f tests/fixtures/staff-message-volume-rollback-guard-assert.sql
          psql -d crm_staff_volume_test -v ON_ERROR_STOP=1 -f db/changes/30-staff-message-volume-scope.rollback.sql
          psql -d crm_staff_volume_test -v ON_ERROR_STOP=1 -f tests/fixtures/staff-message-volume-rollback-assert.sql
          dropdb crm_staff_volume_test
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/performance-coherence-rollback-guard-before.sql
          if psql -v ON_ERROR_STOP=1 -f db/changes/28-performance-coherence.rollback.sql > /tmp/habib-performance-rollback-guard.log 2>&1; then
            cat /tmp/habib-performance-rollback-guard.log
            exit 1
          fi
          grep -F 'SQL28 rollback refused: object changed since release' /tmp/habib-performance-rollback-guard.log
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/performance-coherence-rollback-guard-assert.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/28-performance-coherence.rollback.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/performance-coherence-rollback-assert.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/inventory-goal-rollback-guard-before.sql
          if psql -v ON_ERROR_STOP=1 -f db/changes/27-inventory-goal-source.rollback.sql > /tmp/habib-inventory-rollback-guard.log 2>&1; then
            cat /tmp/habib-inventory-rollback-guard.log
            exit 1
          fi
          grep -F 'SQL27 rollback refused: function changed since release' /tmp/habib-inventory-rollback-guard.log
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/inventory-goal-rollback-guard-assert.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/27-inventory-goal-source.rollback.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/inventory-goal-rollback-assert.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/26-financial-reporting-preservation.rollback.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/financial-reporting-preservation-rollback-assert.sql
          psql -v ON_ERROR_STOP=1 -f db/changes/25-comprehensive-audit-repairs.rollback.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/comprehensive-audit-rollback-assert.sql
