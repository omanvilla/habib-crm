name: Verify published Instagram discovery v16
on:
  push:
    branches: ['codex/instagram-public-verification-20261021']
permissions:
  contents: read
jobs:
  public-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tests/instagram-public-verification.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/instagram-public-startup.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instagram-v16-public-verification
          path: public-verification/
