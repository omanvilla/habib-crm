<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ربط واتساب بركاء — Habib CRM</title>
<style>
body{margin:0;background:#eef3f2;font-family:Arial,sans-serif;color:#2A2118;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}.card{width:min(520px,100%);background:white;border:1px solid #ddd7cb;border-radius:20px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.08)}h1{font-size:22px;margin:0 0 8px}.sub{font-size:13px;color:#6B5A3E;line-height:1.8;margin-bottom:18px}.status{padding:12px 14px;border-radius:12px;background:#f7f4ee;border:1px solid #e5ded2;font-size:13px;line-height:1.7;margin-bottom:14px;white-space:pre-wrap}.ok{background:#eef8f2;border-color:#b8dec5;color:#1B4D3E}.err{background:#fff1f1;border-color:#efc2c2;color:#8B2635}.btn{width:100%;border:0;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;background:#2A2118;color:white}.btn:disabled{opacity:.55;cursor:not-allowed}.back{display:block;text-align:center;margin-top:12px;color:#6B5A3E;text-decoration:none;font-size:13px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="card">
  <h1>ربط رقم بركاء مع Meta</h1>
  <div class="sub">هذه المرة الربط يتم من الخادم باستخدام مفتاح Meta الدائم الموجود أصلًا لمسقط، بدون نافذة تفويض أو Popup.</div>
  <div id="status" class="status">جاري فحص جلسة CRM…</div>
  <button id="connectBtn" class="btn" type="button" disabled>فحص وربط رقم بركاء الآن</button>
  <a class="back" href="./">العودة إلى CRM</a>
</div>
<script>
const SUPABASE_URL='https://dmsckqjkcnsfmnzfjczz.supabase.co';
const SUPABASE_KEY='sb_publishable_cblz5giFrHdXSCYSG6j0Cw_oaxkmHi4';
const supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let sessionReady=false,busy=false;
function setStatus(msg,kind){const el=document.getElementById('status');el.textContent=msg;el.className='status'+(kind==='ok'?' ok':kind==='err'?' err':'');}
(async()=>{try{const {data,error}=await supa.auth.getSession();if(error)throw error;if(!data.session){setStatus('جلسة CRM غير موجودة. ارجع للنظام وسجل الدخول أولاً، وبعدها افتح هذه الصفحة مرة ثانية.','err');return;}sessionReady=true;document.getElementById('connectBtn').disabled=false;setStatus('جلسة CRM موجودة. جاهز لفحص أصول Meta وربط رقم بركاء من الخادم.');}catch(e){setStatus('تعذر قراءة جلسة CRM: '+String(e.message||e),'err')}})();
document.getElementById('connectBtn').addEventListener('click',async function(){
  if(busy||!sessionReady)return;busy=true;this.disabled=true;setStatus('جاري البحث عن رقم بركاء داخل أصول Meta وربطه بالمفتاح الدائم…');
  try{
    const {data,error}=await supa.functions.invoke('whatsapp-direct-bind',{body:{route_key:'barka'}});
    if(error)throw error;if(!data||!data.ok)throw new Error((data&&data.message)||(data&&data.error)||'فشل الربط');
    setStatus('تم ربط رقم بركاء بنجاح.\nالرقم: '+(data.display_phone_number||'+96892344273')+'\nنوع المفتاح: '+(data.credential_type||'system_user')+'\nيمكنك العودة إلى CRM الآن.','ok');
    this.textContent='تم الربط بنجاح';
  }catch(e){
    const m=String(e&&e.message||e);
    if(m.includes('ROUTE_PHONE_NOT_FOUND_IN_BUSINESS_ASSETS'))setStatus('الفحص وصل إلى Meta، لكن رقم بركاء غير ظاهر حتى الآن ضمن أصول WhatsApp Business التي يستطيع المفتاح الدائم رؤيتها. الخطوة التالية ستكون من إعدادات Meta لإضافة/إسناد أصل رقم بركاء، وليس إعادة المحاولة من هنا.','err');
    else if(m.includes('SYSTEM_USER_NOT_ASSIGNED_TO_WABA'))setStatus('وجدنا رقم بركاء في Meta، لكن System User الدائم غير مُسنَد له بعد. ممتاز: الرقم موجود، وباقي فقط إعطاء Habib CRM صلاحية على حساب واتساب بركاء من Business Settings.','err');
    else setStatus('تعذر الربط: '+m,'err');
    busy=false;this.disabled=false;
  }
});
</script>
</body>
</html>
